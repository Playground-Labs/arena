name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the build, for testing only; no release is published"
        required: false
        default: "0.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SPARKLE_VERSION: 2.9.6

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "SPARKLE_ED_PRIVATE_KEY is not set." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must have the form vX.Y.Z." >&2
              exit 1
            fi
            echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            version="${INPUT_VERSION:-0.0.0}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version must have the form X.Y.Z." >&2
              exit 1
            fi
            echo "number=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        id: signing
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "The certificate does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build signed archive
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Arena.xcodeproj \
            -scheme Arena \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/Arena.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -jobs 4 \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

          app="$RUNNER_TEMP/Arena.xcarchive/Products/Applications/Arena.app"

          # Xcode leaves Sparkle's nested helpers with their upstream signature,
          # which notarization rejects. Re-sign them inside out, then the app.
          sparkle="$app/Contents/Frameworks/Sparkle.framework/Versions/B"
          sign() { codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$@"; }
          sign "$sparkle/XPCServices/Installer.xpc"
          sign --preserve-metadata=entitlements "$sparkle/XPCServices/Downloader.xpc"
          sign "$sparkle/Autoupdate"
          sign "$sparkle/Updater.app"
          sign "$app/Contents/Frameworks/Sparkle.framework"
          sign "$app"

          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Arena")" = "x86_64 arm64"

      - name: Notarize and package
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Arena.xcarchive/Products/Applications/Arena.app"
          upload="$RUNNER_TEMP/Arena-notarization.zip"

          ditto -c -k --keepParent "$app" "$upload"
          submission="$(xcrun notarytool submit "$upload" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --output-format json)"
          xcrun notarytool log "$(jq -r .id <<<"$submission")" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          test "$(jq -r .status <<<"$submission")" = "Accepted"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/Arena-$VERSION.zip"
          cd dist
          shasum -a 256 "Arena-$VERSION.zip" > "Arena-$VERSION.zip.sha256"

      - name: Generate Sparkle appcast
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          sparkle="$RUNNER_TEMP/sparkle"
          mkdir -p "$sparkle"
          curl -sSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" | tar -xJ -C "$sparkle"

          key="$RUNNER_TEMP/sparkle-ed.key"
          echo -n "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          "$sparkle/bin/generate_appcast" \
            --ed-key-file "$key" \
            --download-url-prefix "https://github.com/Playground-Labs/arena/releases/download/v$VERSION/" \
            --link "https://github.com/Playground-Labs/arena/releases/tag/v$VERSION" \
            --full-release-notes-url "https://github.com/Playground-Labs/arena/releases/tag/v$VERSION" \
            -o dist/appcast.xml dist
          rm -f "$key"
          grep -q 'sparkle:edSignature' dist/appcast.xml

      - name: Upload build for testing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: Arena-${{ steps.version.outputs.number }}-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Arena-$VERSION.zip#Arena $VERSION" \
            "dist/Arena-$VERSION.zip.sha256#SHA-256 checksum" \
            "dist/appcast.xml#Sparkle appcast" \
            --verify-tag \
            --generate-notes \
            --title "Arena $GITHUB_REF_NAME"

      - name: Remove signing material
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sparkle-ed.key"
